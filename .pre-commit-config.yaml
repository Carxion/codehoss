repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Structural checks only; the full run (executing solutions) happens in CI.
      - id: hoss-validate
        name: hoss validate (structure)
        entry: uv run hoss validate --no-run
        language: system
        pass_filenames: false
        files: ^content/
