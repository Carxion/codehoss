image: python:3.12-slim

stages: [lint, test, validate]

variables:
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files: [uv.lock]
  paths: [.uv-cache]

before_script:
  - pip install --quiet uv
  - uv sync --locked

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  script:
    - uv run pytest

# Sandbox + API tests need a Docker daemon; the plain `test` job skips them.
test-sandbox:
  stage: test
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache python3 py3-pip
    - pip install --quiet --break-system-packages uv
    - uv sync --locked
  script:
    - uv run dojo build-images
    - uv run pytest -m docker
    - uv run dojo validate --sandbox   # Data Science content only runs in its sandbox

web:
  stage: test
  image: node:22-slim
  before_script: []
  cache:
    key:
      files: [web/package-lock.json]
    paths: [web/.npm]
  script:
    - cd web
    - npm ci --cache .npm
    - npm run build   # includes the TypeScript typecheck

validate-content:
  stage: validate
  script:
    # Runs every reference solution and starter against its tests.
    - uv run dojo validate
