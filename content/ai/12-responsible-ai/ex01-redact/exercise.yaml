id: ai.redact
title: Redact personal data
difficulty: 3
prompt: |
  Write `redact(text)` that replaces:

  - email addresses with `[EMAIL]`
  - phone numbers (9 or more digits, possibly with spaces, dashes, dots, brackets or
    a leading `+`) with `[PHONE]`

  `"Call +1 (555) 010-9999 or mail ada@lumen.example"` becomes
  `"Call [PHONE] or mail [EMAIL]"`.
hints:
  - 'An email pattern: r"[\w.+-]+@[\w-]+(\.[\w-]+)+"'
  - 'A phone pattern: r"\+?\d[\d\s().-]{7,}\d" (a digit, 7+ digit-ish characters, a digit)'
  - Replace emails first, then phones, with re.sub.
