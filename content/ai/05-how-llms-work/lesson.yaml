title: How LLMs work
summary: Tokens, context windows and temperature.
steps:
  - type: explain
    md: |
      LLMs read and write **tokens**: chunks of text, often a word or part of one.
      "unbelievable" might be `un` + `believ` + `able`. A rough rule for English:
      **one token ≈ ¾ of a word**, so 100 words ≈ 133 tokens.

      Tokens matter because:

      - models have a **context window**: the most tokens they can read at once
        (your prompt + the conversation + their reply)
      - hosted models **charge per token**
  - type: explain
    md: |
      An LLM produces text by repeatedly predicting the next token. **Temperature**
      controls how adventurous it is: at 0 it nearly always picks the most likely
      token (focused, repeatable); higher values sample more varied tokens (creative,
      less predictable). Local models let you set it; hosted Claude models choose
      their own.
  - type: example
    md: Run the same prompt a few times. Do the answers change?
    code: |
      # %%
      import hoss_ai

      for _ in range(3):
          print(hoss_ai.chat("Name one unusual pet. Just the animal.", temperature=1.0))

      # %%
      for _ in range(3):
          print(hoss_ai.chat("Name one unusual pet. Just the animal.", temperature=0))
  - type: try-it
    prompt: Make `words` the number of words in `text` (split on spaces), and `estimate` that number times 4/3, rounded up with `math.ceil`.
    starter: |
      # %%
      import math

      text = "Large language models predict the next token"
      words = 0  # TODO
      estimate = 0  # TODO
      words, estimate
    solution: |
      # %%
      import math

      text = "Large language models predict the next token"
      words = len(text.split())
      estimate = math.ceil(words * 4 / 3)
      words, estimate
    check: |
      assert words == 7 and estimate == 10, f"words={words}, estimate={estimate}"
    hints:
      - text.split() makes a list of words.
      - estimate = math.ceil(words * 4 / 3)
  - type: exercise
    ref: ex01-token-estimate
  - type: exercise
    ref: ex02-fits-context
  - type: quiz
    question: What does a context window limit?
    options:
      - How many tokens the model can read and write in one go
      - How many users can talk to the model
      - How long the model takes to answer
    answer: 0
