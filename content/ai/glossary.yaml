# Beginner notes shown on hover and in the Library Explorer.
chat: "Sends your prompt to the AI model you picked (top bar, AI) and returns its reply as text. While exercises are checked, a practice model answers instead."
embed: "Turns text into a list of numbers (an embedding). Texts with similar meaning get similar numbers."
simple_embed: "A tiny built-in embedding that counts words. It needs no model and always gives the same answer."
cosine_similarity: "How alike two embeddings are: 1 means same direction, 0 means unrelated."
backend: "Tells you which model is answering right now, e.g. {'provider': 'ollama', 'model': 'qwen2.5:7b'}."
fake: "Used by exercise checks to script the practice model's replies."
system: "Instructions for the model, separate from the conversation: who it is and how to answer."
temperature: "0 makes answers focused and repeatable; higher values make them more varied. Hosted Claude models choose their own."
MLPClassifier: "A neural network for choosing between categories. hidden_layer_sizes sets how many neurons are in each hidden layer."
load_digits: "A built-in dataset of 1,797 small (8x8) pictures of handwritten digits, with their labels."
loads: "json.loads turns a JSON string into Python dicts and lists. It raises an error if the text isn't valid JSON."
dumps: "json.dumps turns Python dicts and lists into a JSON string."
exp: "np.exp(x) is e to the power x, used in the sigmoid function."
dot: "np.dot multiplies matching numbers and adds them up: a weighted sum."
