id: ai.answer-from-handbook
title: Answer from the handbook
difficulty: 4
prompt: |
  The handbook is loaded and chunked for you (`CHUNKS`). Write
  `answer(question, chunks, k=3)`:

  1. Find the `k` chunks most similar to the question (embed the question and the
     chunks with one `dojo_ai.embed` call, rank with `dojo_ai.cosine_similarity`).
  2. Build the prompt:

     ```
     Context:
     <chunk 1>

     <chunk 2>

     <chunk 3>

     Question: <question>
     ```

  3. Call `dojo_ai.chat(prompt, system=SYSTEM)` and return the reply.
hints:
  - Rank like the semantic search exercise and keep the top k chunks.
  - '"Context:\n" + "\n\n".join(top) + f"\n\nQuestion: {question}"'
  - SYSTEM tells the model to answer only from the context, which keeps answers grounded.
