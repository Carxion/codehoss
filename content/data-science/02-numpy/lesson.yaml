title: NumPy arrays
summary: Do maths on whole lists of numbers at once.
steps:
  - type: explain
    md: |
      **NumPy** gives Python fast arrays of numbers. Maths on an array applies to
      **every element at once**, with no loop needed:

      ```python
      import numpy as np
      prices = np.array([2.5, 4.0, 1.5])
      prices * 2          # array([5. , 8. , 3. ])
      prices.mean()       # 2.666...
      ```

      This is called **vectorization**, and it's why data science code is short.
  - type: example
    code: |
      # %%
      import numpy as np

      prices = np.array([2.5, 4.0, 1.5, 6.0])
      prices * 1.2

      # %%
      prices.mean(), prices.max(), prices.sum()
  - type: try-it
    prompt: Convert `temps_c` (Celsius) to Fahrenheit in one line. The formula is `c * 9 / 5 + 32`.
    starter: |
      # %%
      import numpy as np

      temps_c = np.array([0, 12.5, 25, 100])
      temps_f = None  # TODO
      temps_f
    solution: |
      # %%
      import numpy as np

      temps_c = np.array([0, 12.5, 25, 100])
      temps_f = temps_c * 9 / 5 + 32
      temps_f
    check: |
      import numpy as np
      assert temps_f is not None, "Make temps_f hold the converted array"
      assert np.allclose(temps_f, [32, 54.5, 77, 212]), f"temps_f is {temps_f}"
    hints:
      - Use temps_c directly in the formula; NumPy applies it to every value.
      - temps_f = temps_c * 9 / 5 + 32
  - type: explain
    md: |
      A **mask** picks elements with a True/False test:

      ```python
      scores = np.array([55, 82, 91, 67])
      scores > 80           # array([False,  True,  True, False])
      scores[scores > 80]   # array([82, 91])
      (scores > 80).sum()   # 2: True counts as 1
      ```

      Arrays can also be 2-D tables: `table.mean(axis=0)` averages each **column**,
      `axis=1` each **row**.
  - type: try-it
    prompt: Make `high` hold only the scores of **80 or more**, using a mask.
    starter: |
      # %%
      import numpy as np

      scores = np.array([55, 82, 91, 67, 80])
      high = scores  # TODO: filter with a mask
      high
    solution: |
      # %%
      import numpy as np

      scores = np.array([55, 82, 91, 67, 80])
      high = scores[scores >= 80]
      high
    check: |
      assert list(high) == [82, 91, 80], f"high is {list(high)}"
    hints:
      - scores >= 80 makes the mask; put it inside square brackets.
      - high = scores[scores >= 80]
  - type: exercise
    ref: ex01-grade-arrays
  - type: exercise
    ref: ex02-normalise
  - type: quiz
    question: 'What is `np.array([1, 2, 3]) * 2`?'
    options: ['[1, 2, 3, 1, 2, 3]', 'array([2, 4, 6])', 'an error']
    answer: 1
    explanation: Unlike lists, NumPy arrays multiply every element.
