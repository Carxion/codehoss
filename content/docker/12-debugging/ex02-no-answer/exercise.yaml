id: docker.no-answer
title: Running, but nobody answers
difficulty: 3
prompt: 'This one starts and stays up, its port is published... and still nothing answers. Build

  **`bind:1`**, run it as **`bind`** on host port **8086**, and try `curl http://docker:8086`.


  Work out what''s wrong (look at `server.py`, and try `docker exec bind wget -qO- http://127.0.0.1:8000`),

  fix it, rebuild, and run it again.'
hints:
- From inside the container it works; from outside it doesn't. What address does the server listen on?
- 127.0.0.1 inside a container only accepts connections from that same container.
- Change the address in server.py to "0.0.0.0", rebuild bind:1, then docker rm -f bind and run it again.
time_limit_s: 90
