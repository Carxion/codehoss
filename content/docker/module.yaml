id: docker
title: Docker
description: 'Run, build and ship containers in a real lab: your own Docker engine, a terminal, and checks
  that inspect what you built.'
level: intermediate
prerequisites:
- python-basics
sandbox:
  image: dojo-lab
  packages: []
  memory: 512m
  lab: docker
  lab_images:
  - alpine:3.22
  - python:3.12-alpine
  - registry:3.1.2
default_view: lab
lessons:
- 01-containers
- 02-dockerfile
- 03-layers
- 04-ports
- 05-volumes
- 06-compose
- 07-multi-stage
- 08-networks
- 09-health
- 10-security
- 11-registry
- 12-debugging
