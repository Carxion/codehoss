apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-api-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: house-api
      track: canary
  template:
    metadata:
      labels:
        app: house-api
        track: canary
    spec:
      containers:
      - name: api
        image: docker:5000/house-api:1.1.0
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 2
