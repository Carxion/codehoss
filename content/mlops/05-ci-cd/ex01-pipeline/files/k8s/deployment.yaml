apiVersion: apps/v1
kind: Deployment
metadata:
  name: house-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: house-api
  template:
    metadata:
      labels:
        app: house-api
    spec:
      containers:
      - name: api
        image: docker:5000/house-api:latest  # the pipeline pins the exact version
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 2
