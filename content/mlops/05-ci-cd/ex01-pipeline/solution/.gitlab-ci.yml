stages: [test, train, evaluate, build, deploy]

variables:
  MODEL_VERSION: "1.2.0"
  MAX_MAE: "25000"

unit-tests:
  stage: test
  script:
    - python -m pytest -q test_model.py

train:
  stage: train
  script:
    - python train.py
  artifacts:
    paths:
      - model/

quality-gate:
  stage: evaluate
  script:
    - python check_metrics.py

build:
  stage: build
  script:
    - sh release.sh $MODEL_VERSION
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy:
  stage: deploy
  script:
    - kubectl apply -f k8s/
    - kubectl set image deployment/house-api api=docker:5000/house-api:$MODEL_VERSION
    - kubectl rollout status deployment/house-api --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
