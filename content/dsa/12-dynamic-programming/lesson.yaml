title: Dynamic programming
summary: Solve big problems by building up answers to small ones, and never solving the same one twice.
steps:
- type: explain
  md: '**Dynamic programming** (DP) is for problems where the answer to a big case is built

    from answers to smaller cases, and those smaller cases **repeat**. You saw the idea with memoised

    Fibonacci in lesson 5.


    The bottom-up recipe:


    1. Decide what `table[i]` means (for example, "fewest coins to make amount `i`").

    2. Fill in the easy start (`table[0] = 0`).

    3. Fill the rest **in order**, each from entries already filled.


    Coins `[1, 3, 4]`, amount 6: greedy (take the biggest coin first) gives 4 + 1 + 1 = **3 coins**,

    but 3 + 3 is **2 coins**. DP tries every last coin for every amount, so it can''t be fooled.'
- type: showcase
  algorithm: coin-change
  md: 'Each cell is the fewest coins for that amount. To fill a cell, the player tries each coin: *one
    coin + the best for what''s left*. Try coins like 1, 5, 6, 9.'
- type: try-it
  prompt: 'Fill `ways`, where ways[i] is the number of ways to climb i stairs taking 1 or 2 steps at a
    time: ways[i] = ways[i-1] + ways[i-2].'
  starter: "ways = [1, 1] + [0] * 9   # ways[0] and ways[1] are 1\nfor i in range(2, 11):\n    pass  #\
    \ fill ways[i]\n"
  solution: "ways = [1, 1] + [0] * 9\nfor i in range(2, 11):\n    ways[i] = ways[i - 1] + ways[i - 2]\n"
  check: 'assert ways[10] == 89, f''ways[10] is {ways[10]}''

    '
  hints:
  - Replace pass with ways[i] = ways[i - 1] + ways[i - 2].
  - Your last step was either 1 stair (from i-1) or 2 stairs (from i-2).
- type: exercise
  ref: ex01-min-coins
- type: exercise
  ref: ex02-count-ways
- type: quiz
  question: When does dynamic programming help?
  options:
  - When the same smaller subproblems come up again and again
  - Whenever there's a loop
  - Only for problems about money
  answer: 0
  explanation: 'DP pays off when subproblems overlap: you store each answer once instead of recomputing
    it exponentially many times.'
