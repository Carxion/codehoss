id: project.weather-dashboard.chart
title: 'Checkpoint 3: Chart the year'
prompt: '

  Write `plot_temperatures(summary)` that draws **one line per city** (month on the x

  axis, `avg_temp_c` on the y axis) on a single chart, with the title

  `Average temperature by month`, x label `Month`, y label `°C`, and a legend showing the

  city names.

  '
difficulty: 3
hints:
- 'Loop: for city, rows in summary.groupby(''city''):'
- plt.plot(rows["month"], rows["avg_temp_c"], label=city)
- Then plt.title, plt.xlabel, plt.ylabel and plt.legend().
