id: project.expense-tracker.totals
title: 'Checkpoint 2: Totals by category'
prompt: "\nAdd two functions:\n\n- `total(expenses)`: the sum of all amounts, rounded to 2 decimals.\n\
  - `totals_by_category(expenses)`: a dictionary of category -> total (rounded to 2\n  decimals), with\
  \ categories in **alphabetical order**.\n"
difficulty: 3
hints:
- sum(e['amount'] for e in expenses)
- Build a dictionary with totals.get(category, 0) + amount for each expense.
- 'Sort at the end: {c: round(totals[c], 2) for c in sorted(totals)}'
