id: project.movie-recommender.similarity
title: 'Checkpoint 2: How similar?'
prompt: '

  Write `similarity(features, a, b)`: the cosine similarity between the rows for titles

  `a` and `b`: their dot product divided by the product of their lengths.

  '
difficulty: 3
hints:
- features.loc[a].to_numpy() gives a movie's vector.
- np.dot(x, y) / (np.linalg.norm(x) * np.linalg.norm(y))
