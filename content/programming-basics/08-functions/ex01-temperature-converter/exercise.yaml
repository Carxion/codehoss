id: pb.temperature-converter
title: Temperature converter
difficulty: 2
prompt: 'Write two functions:


  - `to_fahrenheit(c)` returns the Celsius temperature `c` in Fahrenheit: `c * 9 / 5 + 32`

  - `to_celsius(f)` does the opposite: `(f - 32) * 5 / 9`


  `to_fahrenheit(100)` is `212` and `to_celsius(212)` is `100`. The tests call your functions

  directly, so they must RETURN the answer.'
hints:
- Each function is one RETURN line.
- RETURN c * 9 / 5 + 32
- RETURN (f - 32) * 5 / 9 (the brackets matter)
