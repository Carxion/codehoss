apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: python:3.12-alpine
        command: ["python", "-m", "http.server", "8000"]
        ports:
        - containerPort: 8000
