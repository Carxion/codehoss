apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: slow
  template:
    metadata:
      labels:
        app: slow
    spec:
      containers:
      - name: slow
        image: python:3.12-alpine
        command: ["sh", "-c", "sleep 6; mkdir -p /srv && echo ok > /srv/ready && exec python -m http.server -d /srv 8000"]
        ports:
        - containerPort: 8000
        # add a readinessProbe and a livenessProbe here
