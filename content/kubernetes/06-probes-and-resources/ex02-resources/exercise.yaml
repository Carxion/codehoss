id: kubernetes.resources
title: Requests and limits
difficulty: 2
prompt: 'Give the `limited` deployment''s container resource **requests** of `50m` CPU and `32Mi` memory,
  and

  **limits** of `200m` CPU and `64Mi` memory. Apply it, then find the pods'' QoS class with

  `kubectl describe pod`.'
hints:
- 'A resources: block inside the container, with requests: and limits:.'
- 'requests: {cpu: 50m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}'
- kubectl apply -f deployment.yaml && kubectl get pod -l app=limited -o jsonpath='{.items[0].status.qosClass}'
time_limit_s: 150
