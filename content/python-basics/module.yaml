id: python-basics
title: Python Basics
description: >
  Learn to program from zero. Every lesson is a series of small steps with instant
  feedback, so you always know what to do next.
level: beginner
prerequisites: []
sandbox:
  image: dojo-python
  packages: []        # standard library only
  network: none
