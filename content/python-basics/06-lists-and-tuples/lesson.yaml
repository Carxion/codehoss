  - type: quiz
    question: 'If `nums = [10, 20, 30]`, what is `nums[-1]`?'
    options: ['10', '30', 'an error']
    answer: 1
    explanation: Negative positions count from the end, so -1 is the last item.
  - type: quiz
    question: 'What does `[n * 2 for n in [1, 2, 3] if n != 2]` give?'
    options: ['[2, 4, 6]', '[2, 6]', '[1, 3]']
    answer: 1
    explanation: The if keeps 1 and 3; each is doubled.
