id: py.hello
title: Hello, world!
difficulty: 1
prompt: |
  Write a program that prints exactly these two lines:

  ```
  Hello, world!
  I am learning Python.
  ```
hints:
  - Use one print() for each line.
  - 'Start with: print("Hello, world!")'
  - 'print("Hello, world!") on one line, then print("I am learning Python.") on the next.'
guide:
  - md: Two messages, two `print` lines. Each `print` starts a new line.
    code: |
      print("Good morning!")
      print("Today is a good day to code.")
