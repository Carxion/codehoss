id: py.stats-toolkit
title: Stats toolkit
difficulty: 4
prompt: |
  Write three functions:

  - `mean(*numbers)` takes **any number** of numbers and returns their average.
    `mean(2, 4, 9)` gives `5.0`. With no numbers at all, return `0`.
  - `summary(numbers, decimals=1)` takes a list and returns **three values**: the
    smallest, the largest, and the mean rounded to `decimals` places.
    `summary([3, 8, 4])` gives `(3, 8, 5.0)`; `summary([1, 2, 2], decimals=2)` gives `(1, 2, 1.67)`.
  - `add_score(score, scores=None)` adds `score` to the list `scores` and returns the
    list. Called without a list, it starts a **new** list every time (watch out for the
    mutable-default trap!).
hints:
  - '*numbers arrives as a tuple, so sum(numbers) and len(numbers) work. Check len(numbers) == 0 first.'
  - 'You can call your own mean inside summary: mean(*numbers) unpacks the list into separate arguments.'
  - 'In add_score: if scores is None: scores = [] then append and return.'
guide:
  - md: A function that takes any number of arguments with `*`, and handles the empty case.
    code: |
      def longest(*words):
          if not words:
              return ""
          return max(words, key=len)

      print(longest("ox", "zebra", "cat"))
      print(repr(longest()))
  - md: Returning several values, with a default parameter controlling the rounding.
    code: |
      def spread(values, places=0):
          gap = max(values) - min(values)
          return gap, round(gap / len(values), places)

      print(spread([2.5, 9.25, 4.0]))
      print(spread([2.5, 9.25, 4.0], places=2))
  - md: The safe way to have an optional list parameter.
    code: |
      def tag(word, tags=None):
          if tags is None:
              tags = []
          tags.append(word)
          return tags

      print(tag("red"))
      print(tag("blue"))       # a fresh list, not ['red', 'blue']
