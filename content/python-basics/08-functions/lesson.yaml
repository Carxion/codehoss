  - type: quiz
    question: What does a function give back if it has no return statement?
    options: ['0', 'None', 'an error']
    answer: 1
  - type: quiz
    question: Why is `def f(items=[]):` a problem?
    options:
      - Lists aren't allowed as defaults
      - The same list is shared by every call that uses the default
      - It makes items a tuple
    answer: 1
    explanation: Defaults are created once. Use items=None and create the list inside the function.
