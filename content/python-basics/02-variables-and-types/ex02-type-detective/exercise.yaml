id: py.type-detective
title: Type detective
difficulty: 1
prompt: |
  Create four variables describing Ada Lovelace, each with the right type:

  | Variable | Value | Type |
  |---|---|---|
  | `name` | Ada | `str` |
  | `born` | 1815 | `int` |
  | `height_m` | 1.65 | `float` |
  | `is_programmer` | True | `bool` |
hints:
  - Text needs quotes. Numbers and True/False don't.
  - 'name = "Ada" and born = 1815 are the first two.'
  - True must start with a capital T and have no quotes.
guide:
  - md: One variable of each type, describing a book. Check each with `type()`.
    code: |
      title = "Dune"
      pages = 412
      rating = 4.6
      is_series = True
      print(type(title), type(pages), type(rating), type(is_series))
