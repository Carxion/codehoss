  - type: quiz
    question: How does pytest know which functions are tests?
    options:
      - They are listed in a settings file
      - Their names start with test_
      - They contain print statements
    answer: 1
  - type: quiz
    question: What does `with pytest.raises(ValueError):` check?
    options:
      - That the code inside raises a ValueError
      - That the code inside never raises any error
      - That ValueError is installed
    answer: 0
