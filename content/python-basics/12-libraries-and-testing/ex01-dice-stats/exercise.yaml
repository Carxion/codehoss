id: py.dice-stats
title: Dice stats
difficulty: 3
prompt: |
  Write two functions:

  - `roll_dice(count, rng)` returns a list of `count` dice rolls (1 to 6), using
    `rng.randint(1, 6)`. `rng` is a `random.Random` object; passing it in makes the
    rolls repeatable in tests.
  - `summarize(rolls)` returns a dictionary with the `"min"`, `"max"` and `"mean"`
    of the rolls. Round the mean to 2 decimal places.

  ```python
  summarize([2, 6, 3])   # {"min": 2, "max": 6, "mean": 3.67}
  ```
hints:
  - 'A list comprehension works well: [rng.randint(1, 6) for _ in range(count)]'
  - statistics.mean(rolls) gives the mean.
  - 'return {"min": min(rolls), "max": max(rolls), "mean": round(statistics.mean(rolls), 2)}'
guide:
  - md: |
      Passing a `random.Random` object in, so the same seed gives the same "random"
      results every time, which makes the function testable. Then a summary dictionary.
    code: |
      import random
      import statistics

      def deal(count, generator):
          return [generator.choice("ABCDEFG") for _ in range(count)]

      def describe(letters):
          return {"first": min(letters), "last": max(letters), "unique": len(set(letters))}

      hand = deal(5, random.Random(42))
      print(hand, describe(hand))
      print(deal(5, random.Random(42)) == hand)   # same seed, same hand
      print(round(statistics.mean([2, 6, 3]), 2))
