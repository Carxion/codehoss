id: py.write-the-tests
title: Write the tests
difficulty: 3
prompt: |
  This time the function is written for you, and **you write the tests**.

  `is_valid_username(name)` returns `True` when a username follows these rules:

  1. 3 to 15 characters long
  2. only lowercase letters, digits and `_`
  3. starts with a letter

  Write `test_...` functions that check every rule, **including the edges** (exactly 3
  and exactly 15 characters, a name starting with a digit, and so on).

  The checks run your tests against the correct function (they must all pass) and
  against **five broken versions**, each with one rule wrong. Every broken version must
  make at least one of your tests fail.
hints:
  - 'Write one test per rule, with both a name that passes and one that fails: assert is_valid_username("abc") and assert not is_valid_username("ab")'
  - Test the exact edges. If 3 to 15 is allowed, check 2, 3, 15 and 16 characters ("a" * 15 makes a 15-letter name).
  - 'Remember: capitals are not allowed, _ is allowed, and the first character must be a letter (try "1abc" and "_abc").'
guide:
  - md: |
      Tests for a different function with rules: a PIN of exactly 4 digits. Each test
      checks one rule, both sides of it, including the edges.
    code: |
      def is_valid_pin(pin):
          return len(pin) == 4 and pin.isdigit()

      def test_four_digits_is_fine():
          assert is_valid_pin("0042")

      def test_too_short_or_too_long():
          assert not is_valid_pin("123")
          assert not is_valid_pin("12345")

      def test_only_digits():
          assert not is_valid_pin("12a4")
          assert not is_valid_pin("12 4")

      for test in (test_four_digits_is_fine, test_too_short_or_too_long, test_only_digits):
          test()
      print("All PIN tests passed")
