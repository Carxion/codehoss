  - type: quiz
    question: Why use `with open(...) as f:`?
    options:
      - It makes the file load faster
      - It closes the file automatically when the block ends
      - It is the only way to read a file
    answer: 1
  - type: quiz
    question: 'You open an existing file with mode `"w"` and write one line. What happens to what was there before?'
    options:
      - It stays, and the line is added at the end
      - It is wiped; the file now holds only the new line
      - Python raises an error because the file exists
    answer: 1
    explanation: '"w" starts the file fresh. Use "a" to append to the end instead.'
