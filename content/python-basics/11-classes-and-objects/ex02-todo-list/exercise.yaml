id: py.todo-list
title: To-do list
difficulty: 3
prompt: |
  Write a `TodoList` class:

  - `add(task)` adds a task (a string).
  - `complete(task)` marks it done. If there's no such task, raise `ValueError`.
  - `pending()` returns a list of tasks not done yet, in the order they were added.
  - `done_count()` returns how many tasks are done.
hints:
  - 'Keep two things in __init__: self.tasks = [] and self.done = set()'
  - In complete, check if task not in self.tasks and raise ValueError.
  - 'pending can use a list comprehension: [t for t in self.tasks if t not in self.done]'
guide:
  - md: |
      A class that keeps a list and a set as attributes: the list remembers order, the set
      remembers which items are "ticked". Here it's a packing list.
    code: |
      class PackingList:
          def __init__(self):
              self.items = []
              self.packed = set()

          def need(self, item):
              self.items.append(item)

          def pack(self, item):
              if item not in self.items:
                  raise ValueError(f"{item} isn't on the list")
              self.packed.add(item)

          def still_to_pack(self):
              return [i for i in self.items if i not in self.packed]

      trip = PackingList()
      for thing in ["passport", "charger", "socks"]:
          trip.need(thing)
      trip.pack("socks")
      print(trip.still_to_pack(), len(trip.packed))
