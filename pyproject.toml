[project]
name = "codehoss"
version = "0.0.1"
description = "Interactive platform for learning Python, data science and AI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pytest>=8.0",  # runtime dep: the grader runs exercise tests with pytest
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=2.7.0",
    "cryptography>=50.0.2",
]

[project.scripts]
hoss = "hoss.cli:app"

[dependency-groups]
dev = ["ruff>=0.6", "pre-commit>=3.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["content", "workspace", ".venv"]
markers = ["docker: needs a running Docker daemon and the sandbox images (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Starter files are learner scaffolding: deliberately incomplete, sometimes deliberately broken.
extend-exclude = ["workspace", "content/**/starter*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Learner-facing content: a bare last expression is how a notebook cell shows its value;
# zip(strict=...) is noise for beginners; expected-output strings in tests run long.
"content/**/*.py" = ["B018", "B905", "E501"]
# A project keeps one import header for all checkpoints; early ones don't use it all yet.
"content/projects/**/*.py" = ["B018", "B905", "E501", "F401"]
# A catalogue of learner-facing messages; splitting them hurts readability.
"src/hoss/explain.py" = ["E501"]
"src/hoss/ai.py" = ["E501"]
