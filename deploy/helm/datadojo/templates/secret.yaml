{{- if not .Values.existingSecret }}
{{- $name := include "datadojo.secretName" . }}
{{- $key := .Values.secretKey }}
{{- if not $key }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key = index .data "secret-key" | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "datadojo.labels" . | nindent 4 }}
  annotations:
    # Saved API keys can't be decrypted without it, so it outlives an uninstall too.
    helm.sh/resource-policy: keep
type: Opaque
data:
  # A Fernet key is 32 random bytes, base64-encoded.
  secret-key: {{ $key | default (randAlphaNum 32 | b64enc) | b64enc | quote }}
{{- end }}
